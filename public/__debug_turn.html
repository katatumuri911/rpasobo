<!doctype html>
<html lang="ja">
<head><meta charset="utf-8"><title>turn debug</title></head>
<body style="margin:0;background:#111;color:#ddd;font:12px monospace">
<div id="out" style="padding:8px;white-space:pre-wrap"></div>
<iframe id="f" src="/?sid=aac82e9723" style="width:360px;height:720px;border:0;display:block;margin:8px"></iframe>
<script>
const f = document.getElementById("f");
window.addEventListener("load", () => {
  const out = document.getElementById("out");
  const t = setInterval(() => {
    try {
      const w = f.contentWindow, d = w.document;
      const log = d.getElementById("chatLog");
      const n = d.querySelectorAll(".msg-wrap.assistant .msg.assistant").length;
      if (log && n > 0 && typeof w.jumpToPrevAssistantReply === "function") {
        clearInterval(t);
        out.textContent = "ready: " + n + " assistants, innerWidth=" + w.innerWidth;
        window.__ready = true;
      }
    } catch (e) { out.textContent = "err " + e.message; }
  }, 200);
});
</script>
</body>
</html>
